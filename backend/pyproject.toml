[project]
name = "crabclaw"
version = "0.1.0"
description = "CrabClaw AI Agent backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.116",
    "uvicorn[standard]>=0.35",
    "python-dotenv>=1.1",
    "pydantic>=2.11",
    "sse-starlette>=2.3",
    "langchain>=1.2",
    "langchain-openai>=1.1",
    "httpx>=0.28",
    "rank-bm25>=0.2",
]
[project.scripts]
crabclaw = "app.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "E501",
    "B008",
    "SIM105",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
